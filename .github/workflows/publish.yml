name: Publish distributions

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install build twine 'readme-renderer[md]'
      - name: Build sdist and wheel
        # The default build creates the wheel from the sdist, checking that it is complete.
        run: python -m build
      - name: Check metadata rendering
        run: python -m twine check --strict dist/*
      - name: Check wheel contents and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import os
          import tomllib
          from zipfile import ZipFile

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == len(sdists) == 1, "expected one wheel and one sdist"
          with ZipFile(wheels[0]) as wheel:
              names = {name for name in wheel.namelist() if not name.endswith("/")}
              info = f"tensor_ee-{version}.dist-info"
              assert {name.split("/", 1)[0] for name in names} == {"tensor_ee", info}, names
              assert "tensor_ee/__init__.py" in names
              metadata = BytesParser().parsebytes(wheel.read(f"{info}/METADATA"))
          assert metadata["Name"] == "tensor-ee"
          assert metadata["Version"] == version
          assert metadata["Description-Content-Type"] == "text/markdown"
          if os.environ["GITHUB_EVENT_NAME"] == "release":
              assert os.environ["RELEASE_TAG"] == f"v{version}", "release tag must match package version"
          print(f"Checked tensor-ee {version}: one sdist and one package-only wheel")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/tensor-ee
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tensor-ee
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
