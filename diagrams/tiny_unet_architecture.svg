<text x="340.0" y="503" class="body" text-anchor="middle">8 → 16 → 16 channels</text>
<text x="340.0" y="530" class="shape" text-anchor="middle">32 × 32 × 16</text>
<rect x="480" y="635" width="270" height="120" rx="16" fill="#ece8fa" stroke="#a195cd" stroke-width="2"/>
