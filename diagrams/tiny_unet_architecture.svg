<text x="615.0" y="698" class="body" text-anchor="middle">16 → 32 → 32 channels</text>
<text x="615.0" y="725" class="shape" text-anchor="middle">16 × 16 × 32</text>
<rect x="860" y="440" width="220" height="120" rx="16" fill="#e4efff" stroke="#85a7d4" stroke-width="2"/>
<text x="970.0" y="473" class="name" text-anchor="middle">Decoder 2</text>
<text x="970.0" y="503" class="body" text-anchor="middle">48 → 16 → 16 channels</text>
<text x="970.0" y="530" class="shape" text-anchor="middle">32 × 32 × 16</text>
<rect x="860" y="230" width="220" height="120" rx="16" fill="#e4efff" stroke="#85a7d4" stroke-width="2"/>
<text x="970.0" y="263" class="name" text-anchor="middle">Decoder 1</text>
<text x="970.0" y="293" class="body" text-anchor="middle">24 → 8 → 8 channels</text>
<text x="970.0" y="320" class="shape" text-anchor="middle">64 × 64 × 8</text>
