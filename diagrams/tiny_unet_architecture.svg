<text x="50" y="63" class="title" text-anchor="start">Tiny U-Net · native Earth Engine inference</text>
<text x="50" y="96" class="sub" text-anchor="start">Two pooling levels  •  29,689 parameters  •  channels: 8 → 16 → 32</text>
<text x="50" y="130" class="small" text-anchor="start">Spatial sizes below show the 64 × 64 Sentinel-1 execution test.</text>
<text x="340" y="182" class="small" text-anchor="middle">ENCODER</text>
<text x="970" y="182" class="small" text-anchor="middle">DECODER</text>
